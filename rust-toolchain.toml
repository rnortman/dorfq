# For the tools that run outside Bazel: rust-analyzer, and nothing in the
# gate. Must equal RUST_VERSION in MODULE.bazel; //tools/pins:pins_test
# checks. No `targets`: the musl and wasm32 cross-builds are Bazel's, and
# rust-analyzer only analyses for the host.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
