# The GitHub forge on one repository, polled once a minute, with the bayes
# scheduler, running as a GitHub App. Set `owner` and `repo` to the
# repository the queue serves (for dorfq itself, the owner and name in the
# `repository` URL of the workspace Cargo.toml), and `client_id` and
# `private_key_file` to the app's, then from the repository root run
#   make run ARGS="run --config $PWD/crates/dorfq/examples/github.toml"
# Creating and installing the app, the label, CI on batch branches and the
# token alternative are in docs/running-on-github.md.

[forge]
kind = "github"
api_base = "https://api.github.com"   # GitHub Enterprise: https://<host>/api/v3
owner = "example-owner"
repo = "dorfq"
trunk = "main"
label = "queue"
checks = ["check"]                    # required check names on heads and batch tips

[forge.auth]
kind = "app"
client_id = "Iv23liEXAMPLE"           # the app's Client ID, from its settings page
private_key_file = "dorfq-app.pem"    # relative to this file's directory

# Or a fixed token read from the environment:
# [forge.auth]
# kind = "token"
# env = "DORFQ_GITHUB_TOKEN"          # the environment variable holding the token

# Set lanes and max_batch to the concurrency and batch size the repository's
# CI can take. p_flake, p_interact, p_miss and p_trunk are priors: set them
# from the repository's own history of flaky runs, pairwise conflicts, breaks
# its CI passed and breaks of trunk or CI that no queued change explains.
[scheduler]
kind = "bayes"
lanes = 2                  # most batches in flight at once
max_batch = 8              # most pull requests one batch may hold
p_interact = 0.001         # prior: a pair fails only together; also the regrowth per pull request landed, from which every belief starts
p_flake = 0.03             # prior: a run fails for no reason
p_miss = 0.02              # prior: CI misses a real break at this rate; a pass lowers a cause's odds by it, never to nothing
p_trunk = 0.001            # prior: between two passes on trunk, trunk or CI breaks for a reason the queue did not test
run_cost = 0.5             # one run, in value units, where a fresh pull request is worth 1
w_reject = 1.0             # resolving a bad pull request, as a multiple of its value
w_age = 0.02               # each hour waited adds this to a pull request's value, for landing and for resolving
eject_above = 0.9          # posterior at which a singled-out cause is ejected
notify_above = 0.5         # posterior at which a singled-out cause's author is told, without an ejection
others_below = 0.1         # a run singles a cause out when every other cause in it is below this
speculate_above = 0.0      # a candidate starts when its score exceeds this
speculation = "chain"      # one chain of batches built to land, culprit finders on trunk; "tree" scores every node's branches

[driver]
tick_millis = 60000
