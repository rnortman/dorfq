# A week of arrivals on two lanes, then until the queue drains, four
# replications, with batch and PR CI both 45 to 120 minutes. github-like
# runs on sixteen lanes, the concurrency GitHub's queue is given in
# practice. Run it with:
#   make sim ARGS="run --config $PWD/crates/dorfq-sim/examples/sim.toml"

seed = 1                   # master seed; every replication's streams derive from it
replications = 4           # independent runs per policy, each from its own seed; the table shows their mean [min–max]

[world]
hours = 168                # arrivals stop after this many hours
drain_hours = 1000         # the backstop: a run lasts until its queue empties, and stops at hours + drain_hours at the latest
stall_hours = 168          # a run is cut off as stalled this long after its last landing or ejection
arrivals_per_hour = 0.75   # mean rate of new pull requests; stacks arrive as a Poisson process at this rate over the mean number of pull requests a stack brings
ci_minutes = { min = 45, max = 120 }   # uniform duration of a batch's CI run
pr_ci_minutes = { min = 45, max = 120 }   # uniform duration of a pull request's own CI run, as long as the batch run; it starts when requested and needs no lane; a pull request is batchable only once it has passed on its current head
rebase_minutes = { min = 15, max = 120 }   # uniform delay from a rebase becoming necessary (a conflict with trunk, or under github admission a landed base) to the author's push of it
pr_ci_on_base_landed = true   # the repository re-runs a pull request's own CI when the pull request it was based on lands; the queue is billed for the direct children's runs
p_interact = 0.001         # a pair conflicts: a run with both fails; whichever lands first breaks the other
p_flake = 0.02             # a run fails for no reason in the tree
p_conflict = 0.02          # a stack arrives with its root conflicting against trunk
repush_per_hour = 0.0      # per open pull request, the rate at which its author pushes a new head; its intent to land is kept
withdraw_per_hour = 0.0    # per open pull request, the rate at which its author takes it out of the queue for good
stack_sizes = [16, 16, 15, 13, 11, 9, 7, 5, 3, 2, 2, 1]   # relative weights of a stack arriving with 1, 2, … 12 pull requests: median 4, mean about 4.2, heavier at the low end
p_stack_grows = 0.3           # a stack later gets a second burst of pull requests on top
stack_growth_sizes = [3, 2, 1]   # relative weights of that burst bringing 1, 2 or 3 pull requests: a few more, mean about 1.7
stack_growth_minutes = { min = 30, max = 480 }   # uniform delay from a stack's arrival to that second burst
p_atomic = 0.2                # a stack lands only whole

# What pooling costs with no failure response at all.
[[policy]]
name = "all-at-once"         # the column's name in the table and on the page
admission = "label"          # dorfq's: in the queue from arrival, held until its own CI passes
kind = "all-at-once"         # the scheduler: one batch of everything ready, and on failure eject every member

# GitHub's merge queue, approximately: each pull request built on top of
# the ones ahead of it, at the concurrency GitHub's queue is given in
# practice; a failed one is removed once everything ahead of it passed,
# and the rest rebuilt. Admission is GitHub's: a stacked pull request waits
# for its base to land, is rebased and re-checked, then enters.
[[policy]]
name = "github-like"         # the column's name in the table and on the page
admission = "github"         # the queue sees a pull request only on trunk, once its own CI passed
kind = "bisect"              # the scheduler: pipelined batches, a failed one split in halves until the culprit is alone
lanes = 16                   # most batches in flight at once
max_batch = 1                # most pull requests one batch may hold

# The conventional pipelined bisect with memory, pooling up to eight.
[[policy]]
name = "bisect"              # the column's name in the table and on the page
admission = "label"          # dorfq's: in the queue from arrival, held until its own CI passes
kind = "bisect"              # the scheduler: pipelined batches, a failed one split in halves until the culprit is alone
lanes = 2                    # most batches in flight at once
max_batch = 8                # most pull requests one batch may hold

# The Bayesian scheduler at the status-quo flags, which measured best in
# the busy world: one chain of batches built to land, with culprit finders
# beside it, its priors set equal to the world's rates.
[[policy]]
name = "bayes"               # the column's name in the table and on the page
admission = "label"          # dorfq's: in the queue from arrival, held until its own CI passes
kind = "bayes"               # the scheduler: batches chosen and culprits inferred from a posterior over who is bad
lanes = 2                    # most batches in flight at once
max_batch = 16               # most pull requests one batch may hold
p_interact = 0.001         # prior: a pair fails only together; also the regrowth per pull request landed, from which every belief starts
p_flake = 0.02             # a run fails for no reason
run_cost = 0.5             # one run, in value units, where a fresh pull request is worth 1
w_reject = 1.0             # resolving a bad pull request, as a multiple of its value
w_age = 0.02             # each hour waited adds this to a pull request's value, for landing and for resolving
eject_above = 0.9          # posterior at which a singled-out cause is ejected
others_below = 0.1         # a run singles a cause out when every other cause in it is below this
speculate_above = 0.0      # a candidate starts when its score exceeds this
speculation = "chain"      # one chain of batches built to land, culprit finders on trunk; "tree" scores every node's branches
charge = "discounted"      # run_cost weighed by the chance the batch's base stands; "full" charges it whole
landing = "decay"          # a landing regrows every other belief by p_interact; "transfer" by each pair's belief

# The tree of futures at the same settings: for every batch in flight,
# what to run if it passes and if it fails, weighed by each future's chance.
[[policy]]
name = "bayes-tree"          # the column's name in the table and on the page
admission = "label"          # dorfq's: in the queue from arrival, held until its own CI passes
kind = "bayes"               # the scheduler: batches chosen and culprits inferred from a posterior over who is bad
lanes = 2                    # most batches in flight at once
max_batch = 16               # most pull requests one batch may hold
p_interact = 0.001         # prior: a pair fails only together; also the regrowth per pull request landed, from which every belief starts
p_flake = 0.02             # a run fails for no reason
run_cost = 0.5             # one run, in value units, where a fresh pull request is worth 1
w_reject = 1.0             # resolving a bad pull request, as a multiple of its value
w_age = 0.02             # each hour waited adds this to a pull request's value, for landing and for resolving
eject_above = 0.9          # posterior at which a singled-out cause is ejected
others_below = 0.1         # a run singles a cause out when every other cause in it is below this
speculate_above = 0.0      # a candidate starts when its net score exceeds this
speculation = "tree"       # for every batch in flight, what to run if it passes and if it fails, weighted by each future's chance; "chain" builds one chain
charge = "full"            # run_cost charged whole whatever the chance the batch's base stands; "discounted" weighs it by that chance
landing = "decay"          # a landing regrows every other belief by p_interact; "transfer" by each pair's belief
