# A week of arrivals on two runners, then a day to drain, four
# replications. Run it with:
#   make sim ARGS="run --config $PWD/crates/dorfq-sim/examples/sim.toml"

seed = 1                   # master seed; every replication's streams derive from it
replications = 4           # independent runs per policy, each from its own seed; the table shows their mean [min–max]

[world]
hours = 168                # arrivals stop after this many hours
drain_hours = 24           # then the run drains, and stops at hours + drain_hours at the latest
arrivals_per_hour = 0.75   # mean rate of new pull requests; arrivals are a Poisson process
runners = 2                # concurrent CI runs, batch and PR CI alike; further runs wait for a runner, first come first served
ci_minutes = { min = 150, max = 210 }   # uniform duration of a batch's CI run
pr_ci_minutes = { min = 40, max = 60 }   # uniform duration of a pull request's own CI run, a lighter check than the batch run; a pull request is batchable only once it has passed on its current head, and setting it equal to the batch run needs more runners
rebase_minutes = { min = 15, max = 120 }   # uniform delay from a rebase becoming necessary (a conflict with trunk, or under github admission a landed base) to the author's push of it
p_bad = 0.05               # a pull request breaks on its own against trunk
p_interact = 0.002         # a pair of pull requests whose queue time overlapped break only together
p_flake = 0.02             # a run fails for no reason in the tree
p_conflict = 0.02          # a pull request arrives with a textual conflict against trunk
repush_per_hour = 0.0      # per open pull request, the rate at which its author pushes a new head; its intent to land is kept
withdraw_per_hour = 0.0    # per open pull request, the rate at which its author takes it out of the queue for good
p_stacked = 0.25           # an arrival is cut from a recent arrival's branch; it stacks on it only while that one is still open
p_atomic = 0.2             # a stacked arrival lands only with its ancestors

# What pooling costs with no failure response at all.
[[policy]]
name = "all-at-once"         # the column's name in the table and on the page
admission = "label"          # dorfq's: in the queue from arrival, held until its own CI passes
kind = "all-at-once"         # the scheduler: one batch of everything ready, and on failure eject every member

# GitHub's merge queue, approximately: each pull request built on top of
# the ones ahead of it, up to five builds in flight; a failed one is removed
# once everything ahead of it passed, and the rest rebuilt. Admission is
# GitHub's: a stacked pull request waits for its base to land, is rebased
# and re-checked, then enters.
[[policy]]
name = "github-like"         # the column's name in the table and on the page
admission = "github"         # the queue sees a pull request only on trunk, once its own CI passed
kind = "bisect"              # the scheduler: pipelined batches, a failed one split in halves until the culprit is alone
lanes = 5                    # most batches in flight at once
max_batch = 1                # most pull requests one batch may hold

# The conventional pipelined bisect with memory, pooling up to eight.
[[policy]]
name = "bisect"              # the column's name in the table and on the page
admission = "label"          # dorfq's: in the queue from arrival, held until its own CI passes
kind = "bisect"              # the scheduler: pipelined batches, a failed one split in halves until the culprit is alone
lanes = 2                    # most batches in flight at once
max_batch = 8                # most pull requests one batch may hold

# The Bayesian scheduler, its priors set equal to the world's rates.
[[policy]]
name = "bayes"               # the column's name in the table and on the page
admission = "label"          # dorfq's: in the queue from arrival, held until its own CI passes
kind = "bayes"               # the scheduler: batches chosen and culprits inferred from a posterior over who is bad
lanes = 2                    # most batches in flight at once
max_batch = 24               # most pull requests one batch may hold
p_bad = 0.05               # prior: a pull request fails on its own against trunk
p_interact = 0.002         # prior: a pair fails only together; also the per-landing decay
p_flake = 0.02             # a run fails for no reason
run_cost = 0.5             # one run, in landed-pull-request units
w_reject = 1.0             # resolving a bad pull request, in the same units
eject_above = 0.9          # posterior at which a singled-out cause is ejected
others_below = 0.1         # a run singles a cause out when every other cause in it is below this
speculate_above = 0.0      # a candidate starts when its score exceeds this
