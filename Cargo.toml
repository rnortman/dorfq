# The Cargo workspace is the single source of truth for crate versions and
# features. Bazel builds it through crate_universe (MODULE.bazel); cargo
# itself is not the build and is not part of the gate.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/rnortman/dorfq"
rust-version = "1.98"

[workspace.dependencies]
base64 = { version = "0.23", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
