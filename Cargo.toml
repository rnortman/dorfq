# The Cargo workspace is the single source of truth for crate versions and
# features. Bazel builds it through crate_universe (MODULE.bazel); cargo
# itself is not the build and is not part of the gate.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/rnortman/dorfq"
rust-version = "1.98"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
